# One public origin for the application: the SPA and the API sit behind the
# same hostname, so there is no CORS and no preflight, and the session token
# never leaves this host.
#
# Artifacts do NOT go through here: they have their own hostname, served by the
# block at the bottom. That separation is what keeps the code inside an
# artifact away from the session of whoever is looking at it.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 128m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # credentialless rather than require-corp: artifacts come from another
    # origin and require-corp would refuse them.
    add_header Cross-Origin-Embedder-Policy "credentialless" always;

    location /api/ {
        proxy_pass http://falconia-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/chat answers with SSE: with buffering on, nginx accumulates the
        # stream and delivers it all at once at the end.
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location /mcp {
        proxy_pass http://falconia-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # Assets with a hash in their name never change content.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # A cached service worker pins people to an old version of the interface,
    # and nobody understands why.
    location = /sw.js {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# The content origin: artifact bytes only.
#
# Point this hostname at the container exactly like the other one. With a
# remotely managed tunnel, add a second public hostname that points here.
server {
    listen 80;
    server_name ~^artifacts\. ~^content\. ~^usercontent\.;

    client_max_body_size 1m;

    location / {
        proxy_pass http://falconia-backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Artifacts can be large and there is nothing to accumulate.
        proxy_buffering off;
    }
}
